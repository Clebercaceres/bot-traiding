services:
  - type: web
    name: tradebot-server
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: METAAPI_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tradebot-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: tradebot-db
    databaseName: tradebot
    user: tradebot
    plan: free
